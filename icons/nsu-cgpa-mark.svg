<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="NSU CGPA Calculator mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bg)"/>

  <!-- Calculator body -->
  <rect x="30" y="26" width="68" height="76" rx="16" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.32)" stroke-width="2"/>
  <rect x="38" y="34" width="52" height="14" rx="8" fill="rgba(255,255,255,0.28)"/>

  <!-- Buttons -->
  <g fill="rgba(255,255,255,0.92)">
    <rect x="38" y="54" width="14" height="14" rx="5"/>
    <rect x="57" y="54" width="14" height="14" rx="5"/>
    <rect x="76" y="54" width="14" height="14" rx="5"/>
    <rect x="38" y="72" width="14" height="14" rx="5"/>
    <rect x="57" y="72" width="14" height="14" rx="5"/>
    <rect x="76" y="72" width="14" height="14" rx="5"/>
  </g>

  <!-- Accent + label -->
  <circle cx="90" cy="36" r="6" fill="url(#accent)"/>
  <text x="64" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" fill="rgba(255,255,255,0.95)">NSU</text>
</svg>


